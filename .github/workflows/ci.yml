name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stage 1 numeric fingerprint (cross-platform check)
        run: python scripts/diag_stage1.py
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Check committed result files
        run: python scripts/check_submission.py
      - name: Execute the notebook
        run: |
          python -m ipykernel install --user --name python3
          RUN_PIPELINE=0 python -c "import nbformat, nbclient; nb = nbformat.read('notebooks/end_to_end.ipynb', 4); nbclient.NotebookClient(nb, timeout=600, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute(); print('notebook ok')"

  reproduce:
    # Full rerun from scratch, then confirm the regenerated files match what is committed.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all three stages
        run: |
          export PYTHONPATH=src
          python -m atomiq.stage1
          python -m atomiq.stage2
          python -m atomiq.stage3
      - name: Submission checks on regenerated files
        run: python scripts/check_submission.py
      - name: Regenerated answer matches committed answer
        run: |
          python - <<'PY'
          import io, json, subprocess
          import pandas as pd
          old1 = pd.read_csv(io.StringIO(subprocess.check_output(["git", "show", "HEAD:stage1_predictions.csv"]).decode()))
          new1 = pd.read_csv("stage1_predictions.csv")
          assert (old1.customer_id == new1.customer_id).all() and (old1["rank"] == new1["rank"]).all(), "ranking differs"
          assert (old1.is_top_10 == new1.is_top_10).all(), "top 10 differs"
          d = (old1.predicted_probability - new1.predicted_probability).abs().max()
          assert d < 1e-9, f"probabilities differ by {d}"
          print(f"stage1 reproduced: same ranking and top 10, max |dp| = {d:.1e}")
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:stage2_selection.json"]))
          new = json.load(open("stage2_selection.json"))
          assert new["selected_ids"] == old["selected_ids"], (new["selected_ids"], old["selected_ids"])
          o3 = json.loads(subprocess.check_output(["git", "show", "HEAD:stage3_simulation.json"]))
          n3 = json.load(open("stage3_simulation.json"))
          assert abs(n3["exact_p_ge3"] - o3["exact_p_ge3"]) < 1e-9
          print("selection and exact P(>=3) reproduced:", new["selected_ids"], n3["exact_p_ge3"])
          PY
