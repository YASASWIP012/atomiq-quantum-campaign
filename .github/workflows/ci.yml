name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stage 1 numeric fingerprint (cross-platform check)
        run: python scripts/diag_stage1.py
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Check committed result files
        run: python scripts/check_submission.py

  reproduce:
    # Full rerun from scratch, then confirm the regenerated files match what is committed.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all three stages
        run: |
          export PYTHONPATH=src
          python -m atomiq.stage1
          python -m atomiq.stage2
          python -m atomiq.stage3
      - name: Submission checks on regenerated files
        run: python scripts/check_submission.py
      - name: Regenerated answer matches committed answer
        run: |
          git diff --exit-code -- stage1_predictions.csv
          python - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:stage2_selection.json"]))
          new = json.load(open("stage2_selection.json"))
          assert new["selected_ids"] == old["selected_ids"], (new["selected_ids"], old["selected_ids"])
          o3 = json.loads(subprocess.check_output(["git", "show", "HEAD:stage3_simulation.json"]))
          n3 = json.load(open("stage3_simulation.json"))
          assert abs(n3["exact_p_ge3"] - o3["exact_p_ge3"]) < 1e-12
          print("selection and exact P(>=3) reproduced:", new["selected_ids"], n3["exact_p_ge3"])
          PY
